name: fetch
on:
  push:
    paths: ['.github/workflows/fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download models
        run: |
          mkdir -p assets
          curl -sSfL -o assets/chip_trellis.glb "https://pikaso.cdnpk.net/private/production/5698076053/trellis2_0f9b23ab1ee443d08f198226e19809d2.glb?token=exp=1792108800~hmac=ca67e527a8bb6f3b9de11072f95fc18d1169970be46c2a7669f06a2f5e755645"
          curl -sSfL -o assets/chip_tripo.glb "https://pikaso.cdnpk.net/private/production/5698068003/model.glb?token=exp=1792108800~hmac=121766d4f9ea8d4d1ceb39ada939328f1a46c98dccdc5fcffdf152f74cd55595"
          curl -sSfL -o assets/chip_ref.png "https://pikaso.cdnpk.net/private/production/5698055146/render.png?token=exp=1792108800~hmac=40e15e4d27e8b5f584384efcaa5db4cdd331358d378473d456c6119cc10627d1"
          ls -la assets
      - name: Commit
        run: |
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add assets
          git commit -m "Add assets"
          git push
